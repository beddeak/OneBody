config-version: 7

# startTick <= 입력 tick < startTick + tolerance. 기본 2틱은 약 100ms.
sync-tolerance-ticks: 2

damage:
  # 매 피해 주기마다의 원시 피해량. 3.0 = 방어구/효과가 없을 때 하트 1.5칸.
  amount-per-tick: 3.0
  # 실패가 계속되면 20틱(정상 TPS에서 1초) 후 첫 피해, 이후 같은 간격.
  interval-ticks: 20

sharing:
  health: true
  hunger: true
  inventory: true

actions:
  jump: true
  # 웅크리기/달리기는 현재 상태 비교. 모두 켜거나 모두 해제하면 복구.
  sneak: true
  sprint: true
  attack: true
  attack-player: true
  block-break: true
  block-place: true
  item-use: true
  door-use: true
  switch-use: true
  container-open: true
  # 음식 섭취는 허기만 공유하며 행동 판정에 포함하지 않습니다.
  # 일반 피격은 원인/피해량을 구분하지 않고 하나로, 낙하 피해만 별도.
  take-damage: true
  fall-damage: true
  # 실제 수평 이동/정지만 비교. 방향은 자유, 전원 이동 또는 전원 정지하면 복구.
  move: true

actionbar:
  # 실패 이후에는 해결할 행동명을 항상 표시합니다.
  enabled: true
  reveal-players: false

startup:
  title: '&b일심동체'
  subtitle: '&7mod by beddeak(침댁)'
  fade-in-ticks: 10
  stay-ticks: 40
  fade-out-ticks: 10

# 모든 메시지는 & 색상 코드를 사용. 성공/실패 채팅은 별도로 끌 수 있음.
