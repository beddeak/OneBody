  prefix: '&8[&b일심동체&8] '
  game-started: '&a게임이 시작되었습니다.'
  game-stopped: '&c게임이 종료되었습니다.'
  too-few: '&c살아 있는 참가자가 2명 이상 필요합니다.'
  start-failed: '&c공유 상태를 안전하게 초기화하지 못했습니다. 서버 로그를 확인하세요.'
  success: '&a일심동체 성공!'
  failed: '&c일심동체 실패!'
  success-enabled: true
  failed-enabled: true
  required-action: '&e해야 할 행동: '
  action-names:
    jump: '&f&l점프'
    sneak: '&f&l웅크리기 &f(모두 웅크리기 또는 모두 해제)'
    sprint: '&f&l스프린트 &f(모두 달리기 또는 모두 해제)'
    attack: '&f&l몹·엔티티 공격'
    attack-player: '&f&l플레이어 공격'
    block-break: '&f&l블록 파괴'
    block-place: '&f&l블록 설치'
    item-use: '&f&l아이템 사용 &f(포션·발사체·양동이)'
    door-use: '&f&l문 조작 &f(문·다락문·울타리문 열기/닫기)'
    switch-use: '&f&l레버·버튼 조작'
    container-open: '&f&l보관함 열기 &f(상자·통·셜커상자)'
    move: '&f&l이동 상태 맞추기 &f(모두 이동 또는 모두 정지, 방향 자유)'
